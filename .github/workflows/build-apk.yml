name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract App Version
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            grep -E "e: |error:|FAILURE:|Execution failed|Unresolved|Mismatch|Conflicting|cannot find|duplicate" build.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk STThemeVault-v${{ steps.ver.outputs.version }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STThemeVault-v${{ steps.ver.outputs.version }}
          path: STThemeVault-v${{ steps.ver.outputs.version }}.apk

      - name: Publish GitHub Release (for In-App OTA Update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Theme Vault ${{ steps.ver.outputs.tag }}
          body: |
            自动构建版本 `${{ steps.ver.outputs.tag }}`
            - 在 APP 右上角点击「检查更新」即可自动下载安装。
          files: STThemeVault-v${{ steps.ver.outputs.version }}.apk
          make_latest: true
